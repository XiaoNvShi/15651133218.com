<path d="M468 900L485 998Q566 1012 646 997L671 891" fill="#806649"/><ellipse cx="567" cy="893" rx="186" ry="53" fill="#82694e"/><ellipse cx="567" cy="885" rx="185" ry="50" fill="#a68b69"/><ellipse cx="567" cy="884" rx="167" ry="41" fill="#9a7957" opacity=".42"/>
