<path d="M526 845Q519 863 530 876Q547 887 566 874Q570 858 557 844Z" fill="#d9d0c0"/><ellipse cx="541" cy="844" rx="18" ry="7" fill="#c7b9a4"/>
<path d="M540 843Q532 800 518 777M541 841Q549 795 576 765M544 842Q547 792 536 746" fill="none" stroke="#88826d" stroke-width="2.5"/>
<path d="M516 777Q486 771 502 748Q524 756 516 777M576 765Q588 744 607 753Q605 771 576 765M536 746Q517 718 533 705Q549 719 536 746" fill="#b1a58d" opacity=".82"/>
<!-- small bowl -->
<ellipse cx="638" cy="897" rx="30" ry="8" fill="#d9c8ae"/><path d="M608 897Q614 916 637 915Q657 913 668 897" fill="#c3af90"/>
<!-- edge lighting -->
<path d="M0 0H900V1050H0Z" fill="none" stroke="#544632" stroke-width="4" opacity=".04"/>
</svg>
