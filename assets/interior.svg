<path d="M142 773Q144 748 177 744H677Q706 747 709 772V866Q697 896 661 898H190Q156 899 140 864Z" fill="url(#sofa)"/>
<path d="M143 788Q423 814 709 788" fill="none" stroke="#fff9f0" stroke-width="9" opacity=".34"/>
<path d="M148 860Q427 876 699 858" fill="none" stroke="#a99e90" stroke-width="3" opacity=".55"/>
<!-- sofa cushions -->
<rect x="219" y="663" width="117" height="115" rx="22" fill="url(#cushion)" transform="rotate(-11 278 722)"/><path d="M243 695L287 735" stroke="#d0c4b7" stroke-width="3" opacity=".6"/>
<rect x="583" y="673" width="105" height="102" rx="20" fill="#c0b6a7" transform="rotate(10 636 725)"/>
